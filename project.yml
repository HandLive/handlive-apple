# XcodeGen — sinh HandLive.xcodeproj (không commit): `cd apple && xcodegen generate`.
# Tối giản có chủ đích: không cấu hình ký (Developer ID cấu hình ở docs/deployment-guide.md).
name: HandLive
options:
  bundleIdPrefix: app.handlive
  # C20: English is the development, source and fallback language; Vietnamese is the second language.
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  HLProtocol:
    path: Packages/HLProtocol
  HLCrypto:
    path: Packages/HLCrypto
  HLTransport:
    path: Packages/HLTransport
  HLDesignSystem:
    path: Packages/HLDesignSystem
  HLLocalization:
    path: Packages/HLLocalization
  HLAppCore:
    path: Packages/HLAppCore
  HLMacUI:
    path: Packages/HLMacUI
targets:
  HandLive:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: macOS/HandLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.handlive.mac
        PRODUCT_NAME: HandLive
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Purpose strings (English, from the catalog) and NSBonjourServices; InfoPlist.xcstrings translates them.
        INFOPLIST_FILE: macOS/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: HandLive
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Màu nhấn toàn app = Color Set AccentColor (accent-fill, sinh bởi generate-design-tokens.py).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # keychain-access-groups: the data-protection keychain of 0.6.1 needs it once the app is signed (Developer ID).
        CODE_SIGN_ENTITLEMENTS: macOS/HandLive.entitlements
    dependencies:
      - package: HLProtocol
      - package: HLCrypto
      - package: HLTransport
      - package: HLDesignSystem
      - package: HLLocalization
      - package: HLAppCore
      - package: HLMacUI
