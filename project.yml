# XcodeGen — sinh HandLive.xcodeproj (không commit): `cd apple && xcodegen generate`.
# Tối giản có chủ đích: không cấu hình ký (Developer ID cấu hình ở docs/deployment-guide.md).
name: HandLive
options:
  bundleIdPrefix: app.handlive
  # C20: English is the development, source and fallback language; Vietnamese is the second language.
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
  # LastUpgradeCheck: without it xcodegen writes 1430 and Xcode keeps asking to "Update to recommended settings".
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Xcode 27's recommended project settings (Base_ProjectSettings template) that xcodegen's presets do not set.
    # No target has a run-script phase, so the script sandbox changes nothing today; no C or C++ sources either.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  HLProtocol:
    path: Packages/HLProtocol
  HLCrypto:
    path: Packages/HLCrypto
  HLTransport:
    path: Packages/HLTransport
  HLDesignSystem:
    path: Packages/HLDesignSystem
  HLLocalization:
    path: Packages/HLLocalization
  HLAppCore:
    path: Packages/HLAppCore
  HLSMS:
    path: Packages/HLSMS
  HLSMSUI:
    path: Packages/HLSMSUI
  HLCalls:
    path: Packages/HLCalls
  HLMacUI:
    path: Packages/HLMacUI
  HLiOSUI:
    path: Packages/HLiOSUI
targets:
  HandLive:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: macOS/HandLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.handlive.mac
        PRODUCT_NAME: HandLive
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        # Purpose strings (English, from the catalog) and NSBonjourServices; InfoPlist.xcstrings translates them.
        INFOPLIST_FILE: macOS/Info.plist
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: HandLive
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Màu nhấn toàn app = Color Set AccentColor (accent-fill, sinh bởi generate-design-tokens.py).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # App icon: macOS/HandLive/Resources/AppIcon.icon (Icon Composer, Liquid Glass), shared with HandLiveiOS and
        # generated by the hub's tools/brand/build_brand_assets.py. actool renders the macOS 13–15 icons (Assets.car and
        # AppIcon.icns) from it; the project owner accepted losing the compact mark at 16 and 32 pt (2026-10-07).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Every size (16–512 pt at 1x and 2x) in the loose AppIcon.icns too, not only 16 and 128 pt: the Assets.car
        # holds 2x renditions alone.
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
        # keychain-access-groups: the data-protection keychain of 0.6.1 needs it once the app is signed (Developer ID);
        # communication notifications (also what reading the Focus status needs) and time-sensitive notifications for
        # calls during a Focus (CALL-01 API 7).
        CODE_SIGN_ENTITLEMENTS: macOS/HandLive.entitlements
    dependencies:
      - package: HLProtocol
      - package: HLCrypto
      - package: HLTransport
      - package: HLDesignSystem
      - package: HLLocalization
      - package: HLAppCore
      - package: HLMacUI
  # iPhone and iPad (SET-03, CLIP-04, SMS-01…05): thin app sources over HLiOSUI; builds on CI for the simulator
  # without signing. The App Group group.app.hxd.handlive is shared with the extension (settings suite, keychain group).
  HandLiveiOS:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - HandLiveiOSUITests
    sources:
      - path: iOS/HandLive
      # Colors of the design system, the AccentColor set included (generated by generate-design-tokens.py).
      - path: macOS/HandLive/Resources/Assets.xcassets
      # The app icon, one document for both apps.
      - path: macOS/HandLive/Resources/AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.handlive.ios
        PRODUCT_NAME: HandLive
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # Purpose strings (English, from the catalog), NSBonjourServices, NSUserActivityTypes; InfoPlist.xcstrings
        # translates them. Resources/Localizable.xcstrings holds the push.* loc-keys of APNs alerts.
        INFOPLIST_FILE: iOS/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: HandLive
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # App icon: the shared macOS/HandLive/Resources/AppIcon.icon (Icon Composer, Liquid Glass); actool renders the
        # iOS 16–18 icon from it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # aps-environment, the App Group, the keychain groups and communication notifications: active once signed.
        CODE_SIGN_ENTITLEMENTS: iOS/HandLive.entitlements
    dependencies:
      - package: HLiOSUI
      - target: HandLiveNotificationService
  # Scratch, not committed: drives the Simulator for App Store screenshot capture (task_05ef3c28a93f).
  HandLiveiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOS/HandLiveScreenshotUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.handlive.ios.screenshotuitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HandLiveiOS
  # I-NSE (CONN-04 step 9b): decrypts `hl` with K_push while unlocked and rebuilds SMS and call notifications; no
  # database, no network.
  HandLiveNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.handlive.ios.notifications
        PRODUCT_NAME: HandLiveNotificationService
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: iOS/NotificationService-Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/NotificationService.entitlements
    dependencies:
      - package: HLSMS
        product: HLSMSNotifications
      - package: HLCalls
        product: HLCallNotifications
      - package: HLProtocol
      - package: HLCrypto
      - package: HLAppCore
      - package: HLTransport
