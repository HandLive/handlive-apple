# CI Apple: test 4 Swift package bằng xcodebuild, SwiftLint --strict, build app macOS (không ký).
# Bố cục workspace như máy dev: kho hub handlive ở gốc (test HLDesignSystem đọc ../docs), kho này ở apple/,
# kho handlive-shared ở shared/ (test đọc ../shared). Hub phải checkout TRƯỚC (checkout ở gốc dọn sạch thư mục).
# Sửa shared hay docs không tự kích hoạt workflow này: chạy tay (workflow_dispatch).
# Kho private trong group cần secret HANDLIVE_REPOS_TOKEN (quyền đọc nội dung các kho); kho public thì github.token đủ.
# KHÔNG đặt HL_SWIFT_TESTING_PACKAGE: có Xcode thì dùng module Testing đi kèm, và HLDesignSystem
# biên dịch asset catalog (actool) + khối #Preview.
name: ci-apple

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: commit đứng tên người thật
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Không có danh tính hay trailer của công cụ AI trong commit mới
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .githooks/check-commits.sh "$BASE..$HEAD_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            .githooks/check-commits.sh --max-count=200 "$HEAD_SHA"   # nhánh mới hoặc force-push: kiểm 200 commit gần nhất
          else
            .githooks/check-commits.sh "$BEFORE..$HEAD_SHA"
          fi

  build-test:
    name: xcodebuild test + swiftlint + build app
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DERIVED_DATA: ${{ github.workspace }}/.ci-derived-data
    steps:
      - name: Resolve matching branches of the hub and handlive-shared
        id: refs
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
        run: |
          # gh reads GH_TOKEN from the environment: the token never appears in a URL or on a command line.
          # The branch name is data: URL-encoded per path segment in the API path, and passed to jq with --arg (never
          # spliced into the jq program).
          encoded="$(jq -rn --arg b "$BRANCH" '$b | split("/") | map(@uri) | join("/")')"
          resolve() {
            n="$(gh api "repos/${OWNER}/$1/git/matching-refs/heads/${encoded}" 2>/dev/null \
              | jq --arg r "refs/heads/${BRANCH}" 'map(select(.ref == $r)) | length' || echo 0)"
            if [ "$n" = 1 ]; then echo "$BRANCH"; else echo main; fi
          }
          hub="$(resolve handlive)"; shared="$(resolve handlive-shared)"
          echo "hub=$hub" >> "$GITHUB_OUTPUT"; echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "hub → $hub, handlive-shared → $shared"

      - name: Kho hub handlive ở gốc workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/handlive
          ref: ${{ steps.refs.outputs.hub }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: apple
          persist-credentials: false

      - name: Kho handlive-shared cạnh apple/
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/handlive-shared
          path: shared
          ref: ${{ steps.refs.outputs.shared }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: Chọn Xcode ổn định mới nhất
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Phiên bản công cụ
        run: |
          xcodebuild -version
          swift --version

      # DerivedData riêng cho từng package + app, khóa theo Package.swift và project.yml.
      - name: Cache DerivedData
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.DERIVED_DATA }}
          key: apple-dd-${{ runner.os }}-${{ hashFiles('apple/Packages/*/Package.swift', 'apple/ThirdParty/*/Package.swift', 'apple/project.yml') }}
          restore-keys: apple-dd-${{ runner.os }}-

      # SQLCipher's XCFramework as a local binary target: xcodebuild hangs downloading the remote one on this runner.
      - name: Fetch SQLCipher (checksum-verified)
        run: apple/ThirdParty/SQLCipher/fetch.sh

      # Chạy xcodebuild trong thư mục package (không cần .xcodeproj): scheme tự sinh của package
      # một product cùng tên có luôn test target.
      - name: xcodebuild test (every package)
        # Insurance against a hanging test: without this a stuck test runs until the 90-min job timeout. A per-package
        # watchdog below fails fast and names the package; this step cap is the backstop.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          for pkg in HLProtocol HLCrypto HLTransport HLDesignSystem HLLocalization HLAppCore HLSMS HLSMSUI HLCalls HLMacUI HLiOSUI; do
            echo "::group::xcodebuild test $pkg"
            # A package with several products (HLSMS: HLSMS + HLSMSNotifications; HLCalls: HLCalls, HLCallNotifications,
            # HLCallsUI) runs its tests in "<name>-Package".
            scheme="$pkg"; case "$pkg" in HLSMS|HLCalls) scheme="$pkg-Package" ;; esac
            # Run in the background and kill it if it stalls, so a hanging test fails *this* package (named) in minutes
            # instead of stranding the whole step.
            # Run serially: several call/session suites coordinate real-time async reconnection and are correct but
            # not safe to run concurrently (they race for the MainActor under parallel execution). The product logic
            # is unchanged; only the test scheduling is.
            (cd "apple/Packages/$pkg" && xcodebuild test \
              -scheme "$scheme" \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              -derivedDataPath "$DERIVED_DATA/$pkg") &
            xpid=$!
            (sleep 720; kill -9 "$xpid" 2>/dev/null) &
            watchdog=$!
            if wait "$xpid"; then
              kill "$watchdog" 2>/dev/null || true
            else
              status=$?
              kill "$watchdog" 2>/dev/null || true
              echo "::error::xcodebuild test $pkg failed or exceeded 720s (exit $status) — a failing or hanging test"
              exit 1
            fi
            echo "::endgroup::"
          done

      # The headless dev client (apple/Tools/HandLiveDevClient) is not part of the apps: built only, so it keeps
      # compiling against the packages.
      - name: swift build dev client
        working-directory: apple/Tools/HandLiveDevClient
        run: swift build

      # The HFP spike probe (apple/Tools/HFPSpike) runs by hand with a real phone: built only.
      - name: swift build HFP spike
        working-directory: apple/Tools/HFPSpike
        run: swift build

      - name: Cài XcodeGen + SwiftLint
        run: brew install xcodegen swiftlint

      - name: swiftlint lint --strict
        working-directory: apple
        run: swiftlint lint --strict

      - name: xcodegen generate
        working-directory: apple
        run: |
          xcodegen generate
          xcodebuild -list -project HandLive.xcodeproj

      - name: Build app macOS (không ký)
        run: |
          xcodebuild build \
            -project apple/HandLive.xcodeproj \
            -scheme HandLive \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA/app" \
            CODE_SIGNING_ALLOWED=NO

      # The iPhone/iPad app with its Notification Service Extension, for the simulator, unsigned.
      - name: Build app iOS + Notification Service Extension (simulator, unsigned)
        run: |
          xcodebuild build \
            -project apple/HandLive.xcodeproj \
            -scheme HandLiveiOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA/app-ios" \
            CODE_SIGNING_ALLOWED=NO
