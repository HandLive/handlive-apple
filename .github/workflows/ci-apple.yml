# CI Apple: test the Swift packages with xcodebuild, SwiftLint --strict, build the macOS and iOS apps (unsigned).
# Bố cục workspace như máy dev: kho hub handlive ở gốc (test HLDesignSystem đọc ../docs), kho này ở apple/,
# kho handlive-shared ở shared/ (test đọc ../shared). Hub phải checkout TRƯỚC (checkout ở gốc dọn sạch thư mục).
# Sửa shared hay docs không tự kích hoạt workflow này: chạy tay (workflow_dispatch).
# Kho private trong group cần secret HANDLIVE_REPOS_TOKEN (quyền đọc nội dung các kho); kho public thì github.token đủ.
# KHÔNG đặt HL_SWIFT_TESTING_PACKAGE: có Xcode thì dùng module Testing đi kèm, và HLDesignSystem
# biên dịch asset catalog (actool) + khối #Preview.
name: ci-apple

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test targets of the core packages: the "core" lane tests these, the "features" lane every other test target.
  CORE_TESTS: HLProtocolTests HLCryptoTests HLTransportTests HLAppCoreTests

jobs:
  commit-policy:
    name: commit đứng tên người thật
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Không có danh tính hay trailer của công cụ AI trong commit mới
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .githooks/check-commits.sh "$BASE..$HEAD_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            .githooks/check-commits.sh --max-count=200 "$HEAD_SHA"   # nhánh mới hoặc force-push: kiểm 200 commit gần nhất
          else
            .githooks/check-commits.sh "$BEFORE..$HEAD_SHA"
          fi

  build-test:
    # Four lanes on parallel macOS runners. A test lane builds the packages it needs ONCE through a shared scheme of
    # HandLive.xcworkspace (Tools/make-test-scheme.sh), not once per package; the Mac app then reuses the features
    # lane's build. No DerivedData cache: a fresh checkout changes every source's mtime, so a restored cache rebuilt
    # everything anyway and only cost its restore and save (~2 min). The apps build for arm64 only (compile check).
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false # one red lane still lets the others report
      matrix:
        include:
          - lane: core
            name: test core packages
          - lane: features
            name: test feature packages + build Mac app
          - lane: ios
            name: build iOS app + Notification Service Extension
          - lane: tools
            name: swiftlint + build dev tools
    env:
      DERIVED_DATA: ${{ github.workspace }}/.ci-derived-data
      HOMEBREW_NO_AUTO_UPDATE: "1"
      LANE: ${{ matrix.lane }}
    steps:
      - name: Resolve matching branches of the hub and handlive-shared
        id: refs
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
        run: |
          # gh reads GH_TOKEN from the environment: the token never appears in a URL or on a command line.
          # The branch name is data: URL-encoded per path segment in the API path, and passed to jq with --arg (never
          # spliced into the jq program).
          encoded="$(jq -rn --arg b "$BRANCH" '$b | split("/") | map(@uri) | join("/")')"
          resolve() {
            n="$(gh api "repos/${OWNER}/$1/git/matching-refs/heads/${encoded}" 2>/dev/null \
              | jq --arg r "refs/heads/${BRANCH}" 'map(select(.ref == $r)) | length' || echo 0)"
            if [ "$n" = 1 ]; then echo "$BRANCH"; else echo main; fi
          }
          hub="$(resolve handlive)"; shared="$(resolve handlive-shared)"
          echo "hub=$hub" >> "$GITHUB_OUTPUT"; echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "hub → $hub, handlive-shared → $shared"

      - name: Kho hub handlive ở gốc workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/handlive
          ref: ${{ steps.refs.outputs.hub }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: apple
          persist-credentials: false

      - name: Kho handlive-shared cạnh apple/
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/handlive-shared
          path: shared
          ref: ${{ steps.refs.outputs.shared }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: Chọn Xcode ổn định mới nhất
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Phiên bản công cụ
        run: |
          xcodebuild -version
          swift --version

      # SQLCipher's XCFramework as a local binary target: xcodebuild hangs downloading the remote one on this runner.
      # Every lane needs it: the workspace's package graph includes GRDB.
      - name: Fetch SQLCipher (checksum-verified)
        run: apple/ThirdParty/SQLCipher/fetch.sh

      - name: Test scheme of this lane
        if: matrix.lane == 'core' || matrix.lane == 'features'
        working-directory: apple
        run: |
          # CORE_TESTS is a list of names: split on purpose.
          # shellcheck disable=SC2086
          if [ "$LANE" = core ]; then
            Tools/make-test-scheme.sh HLTests-core only $CORE_TESTS
          else
            Tools/make-test-scheme.sh HLTests-features except $CORE_TESTS
          fi

      - name: xcodebuild test
        if: matrix.lane == 'core' || matrix.lane == 'features'
        # A hanging test fails this step in minutes instead of running into the job timeout; the log's last
        # "◇ Test … started" line names it.
        timeout-minutes: 20
        working-directory: apple
        # Serial: several call/session suites coordinate real-time async reconnection and are correct but not safe to
        # run concurrently (they race for the MainActor under parallel execution). The product logic is unchanged.
        run: |
          xcodebuild test \
            -workspace HandLive.xcworkspace \
            -scheme "HLTests-$LANE" \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -derivedDataPath "$DERIVED_DATA"

      - name: xcodegen generate
        if: matrix.lane == 'features' || matrix.lane == 'ios'
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build Mac app (unsigned, arm64; reuses the packages the tests built)
        if: matrix.lane == 'features'
        working-directory: apple
        run: |
          xcodebuild build \
            -workspace HandLive.xcworkspace \
            -scheme HandLive \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

      # The iPhone/iPad app with its Notification Service Extension, for the simulator, unsigned.
      - name: Build iOS app + Notification Service Extension (simulator, unsigned, arm64)
        if: matrix.lane == 'ios'
        working-directory: apple
        run: |
          xcodebuild build \
            -workspace HandLive.xcworkspace \
            -scheme HandLiveiOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      - name: swiftlint lint --strict
        if: matrix.lane == 'tools'
        working-directory: apple
        run: |
          brew install swiftlint
          swiftlint lint --strict

      # The headless dev client (apple/Tools/HandLiveDevClient) is not part of the apps: built only, so it keeps
      # compiling against the packages.
      - name: swift build dev client
        if: matrix.lane == 'tools'
        working-directory: apple/Tools/HandLiveDevClient
        run: swift build

      # The HFP spike probe (apple/Tools/HFPSpike) runs by hand with a real phone: built only.
      - name: swift build HFP spike
        if: matrix.lane == 'tools'
        working-directory: apple/Tools/HFPSpike
        run: swift build
