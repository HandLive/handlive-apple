# CI Apple: test 4 Swift package bằng xcodebuild, SwiftLint --strict, build app macOS (không ký).
# Bố cục workspace như máy dev: kho hub handlive ở gốc (test HLDesignSystem đọc ../docs), kho này ở apple/,
# kho handlive-shared ở shared/ (test đọc ../shared). Hub phải checkout TRƯỚC (checkout ở gốc dọn sạch thư mục).
# Sửa shared hay docs không tự kích hoạt workflow này: chạy tay (workflow_dispatch).
# Kho private trong group cần secret HANDLIVE_REPOS_TOKEN (quyền đọc nội dung các kho); kho public thì github.token đủ.
# KHÔNG đặt HL_SWIFT_TESTING_PACKAGE: có Xcode thì dùng module Testing đi kèm, và HLDesignSystem
# biên dịch asset catalog (actool) + khối #Preview.
name: ci-apple

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: commit đứng tên người thật
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Không có danh tính hay trailer của công cụ AI trong commit mới
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            .githooks/check-commits.sh "$BASE..$HEAD_SHA"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            .githooks/check-commits.sh --max-count=200 "$HEAD_SHA"   # nhánh mới hoặc force-push: kiểm 200 commit gần nhất
          else
            .githooks/check-commits.sh "$BEFORE..$HEAD_SHA"
          fi

  build-test:
    name: xcodebuild test + swiftlint + build app
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DERIVED_DATA: ${{ github.workspace }}/.ci-derived-data
    steps:
      - name: Resolve matching branches of the hub and handlive-shared
        id: refs
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
        run: |
          resolve() {
            if git ls-remote --exit-code --heads "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/$1.git" "$BRANCH" >/dev/null 2>&1; then echo "$BRANCH"; else echo main; fi
          }
          hub="$(resolve handlive)"; shared="$(resolve handlive-shared)"
          echo "hub=$hub" >> "$GITHUB_OUTPUT"; echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "hub → $hub, handlive-shared → $shared"

      - name: Kho hub handlive ở gốc workspace
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/handlive
          ref: ${{ steps.refs.outputs.hub }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}

      - uses: actions/checkout@v5
        with:
          path: apple

      - name: Kho handlive-shared cạnh apple/
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/handlive-shared
          path: shared
          ref: ${{ steps.refs.outputs.shared }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}

      - name: Chọn Xcode ổn định mới nhất
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Phiên bản công cụ
        run: |
          xcodebuild -version
          swift --version

      # DerivedData riêng cho từng package + app, khóa theo Package.swift và project.yml.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: apple-dd-${{ runner.os }}-${{ hashFiles('apple/Packages/*/Package.swift', 'apple/project.yml') }}
          restore-keys: apple-dd-${{ runner.os }}-

      # Chạy xcodebuild trong thư mục package (không cần .xcodeproj): scheme tự sinh của package
      # một product cùng tên có luôn test target.
      - name: xcodebuild test (every package)
        run: |
          set -euo pipefail
          for pkg in HLProtocol HLCrypto HLTransport HLDesignSystem HLLocalization; do
            echo "::group::xcodebuild test $pkg"
            (cd "apple/Packages/$pkg" && xcodebuild test \
              -scheme "$pkg" \
              -destination 'platform=macOS' \
              -derivedDataPath "$DERIVED_DATA/$pkg")
            echo "::endgroup::"
          done

      - name: Cài XcodeGen + SwiftLint
        run: brew install xcodegen swiftlint

      - name: swiftlint lint --strict
        working-directory: apple
        run: swiftlint lint --strict

      - name: xcodegen generate
        working-directory: apple
        run: |
          xcodegen generate
          xcodebuild -list -project HandLive.xcodeproj

      - name: Build app macOS (không ký)
        run: |
          xcodebuild build \
            -project apple/HandLive.xcodeproj \
            -scheme HandLive \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA/app" \
            CODE_SIGNING_ALLOWED=NO
