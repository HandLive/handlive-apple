# Release: builds the Apple installables of a version tag and attaches them, with their SHA-256, to that tag's GitHub
# Release (created when missing, pre-release when the tag has a suffix such as -beta.1).
# - iOS/iPadOS: HandLive-<version>-ios-unsigned.ipa, a Release build for devices with its Notification Service
#   Extension, not signed: sideloading tools re-sign it with the installer's own Apple ID. App Store/TestFlight
#   distribution needs the paid Apple Developer Program team.
# - macOS: HandLive-<version>-macos-unsigned.dmg, the universal app signed ad hoc: the user allows it once in System
#   Settings › Privacy & Security › Open Anyway, and it keeps its keys in the login keychain (0.6.1). With the signing
#   secrets below it is HandLive-<version>-macos.dmg instead: Developer ID, hardened runtime, notarized and stapled.
#   A tag older than the login-keychain support (v0.1.0-beta.1) publishes no Mac app without those secrets.
# Runs on a pushed tag v*, or by hand for an existing tag: publish=false keeps the files as workflow artifacts only; a
# file already attached is never replaced unless replace=true.
#
# Three jobs, split so that the job that RUNS built code never holds a secret:
#   sign    (environment "release", contents: read) builds with xcodegen/xcodebuild, signs the Mac app (ad hoc, or
#           Developer ID + notarization with the secrets), packs the IPA and the DMG and writes their SHA-256. It is the
#           only job that reads the signing and notarization secrets, each one only in the env of the step that needs it.
#   launch  (no environment, permissions: {}, no reference to the secrets context) downloads the packed files and checks
#           them read-only: the IPA is a sound archive with the app inside, the DMG mounts and its app stays up for 10 s.
#           This is the only place the built app is executed.
#   publish (environment "release", contents: write) needs sign and launch, checks every file against its SHA-256 and
#           attaches them to the Release. It runs no built code and checks out no code.
# The files travel between the jobs as the workflow artifact build-<platform>-<version> (unchanged names); publish keeps
# the final set as apple-<version>.
# MARKETING_VERSION in project.yml must equal the tag's version core (v0.1.0-beta.1 → 0.1.0). The hub and
# handlive-shared are checked out at the same tag (push their tags first); one without it falls back to main with a
# warning.
# macOS secrets (docs/deployment-guide.md, Release builds), all or none, environment secrets of "release" read by the
# sign job only: APPLE_TEAM_ID,
# APPLE_DEVELOPER_ID_P12_BASE64 + APPLE_DEVELOPER_ID_P12_PASSWORD (the "Developer ID Application" certificate with its
# private key), APPLE_MAC_PROFILE_BASE64 (Developer ID provisioning profile of app.handlive.mac with Keychain Sharing,
# Communication Notifications and Time Sensitive Notifications), APPLE_NOTARY_KEY_P8_BASE64 + APPLE_NOTARY_KEY_ID +
# APPLE_NOTARY_ISSUER_ID (App Store Connect API key for notarytool).
name: release-apple

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build, e.g. v0.1.0-beta.1
        required: true
        type: string
      publish:
        description: Attach the files to the tag's GitHub Release (off = workflow artifacts only)
        type: boolean
        default: true
      replace:
        description: Replace files already attached to that Release
        type: boolean
        default: false

# Every job states its own rights; this default is the floor.
permissions:
  contents: read

concurrency:
  group: release-apple-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  sign:
    name: sign ${{ matrix.platform }}
    # macOS 26: on a macOS 15 host, actool (Xcode 26) crashes rendering the Mac app icon from AppIcon.icon; every job
    # that compiles the apps needs a macOS 26 host.
    runs-on: macos-26
    timeout-minutes: 60
    # The environment holds the macOS secrets (only tags v* and main may use it). No step of this job launches the
    # built app: that is the launch job.
    environment: release
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [ios, macos]
    env:
      DERIVED_DATA: ${{ github.workspace }}/.release-derived-data
      HOMEBREW_NO_AUTO_UPDATE: "1"
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Tag
        id: tag
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
        run: |
          # The tag names files and API paths: one line, vMAJOR.MINOR.PATCH with an optional -suffix.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Not a version tag: $TAG (expected v1.2.3 or v1.2.3-beta.1)"; exit 1
          fi
          # The same tag in the hub and handlive-shared; a missing one falls back to main, any other API error stops.
          resolve() {
            if gh api "repos/${OWNER}/$1/git/ref/tags/${TAG}" > /dev/null 2> "$RUNNER_TEMP/resolve.err"; then
              ref="$TAG"
            elif grep -q 'HTTP 404' "$RUNNER_TEMP/resolve.err"; then
              ref=main
              echo "::warning::$1 has no tag $TAG: built against its main (push the hub and handlive-shared tags first)"
            else
              echo "::error::Cannot read the tags of $1: $(cat "$RUNNER_TEMP/resolve.err")"; exit 1
            fi
          }
          resolve handlive; hub="$ref"
          resolve handlive-shared; shared="$ref"
          version="${TAG#v}"
          { echo "hub=$hub"; echo "shared=$shared"; echo "version=$version"; echo "core=${version%%-*}"; } >> "$GITHUB_OUTPUT"
          echo "$TAG: hub → $hub, handlive-shared → $shared"

      - name: Kho hub handlive ở gốc workspace
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/handlive
          ref: ${{ steps.tag.outputs.hub }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: Kho apple tại tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: apple
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # the previous tag's build number
          persist-credentials: false

      - name: Kho handlive-shared cạnh apple/
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ${{ github.repository_owner }}/handlive-shared
          path: shared
          ref: ${{ steps.tag.outputs.shared }}
          token: ${{ secrets.HANDLIVE_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: The tag matches MARKETING_VERSION; the build number went up
        working-directory: apple
        env:
          CORE: ${{ steps.tag.outputs.core }}
        run: |
          setting() { git show "$1:project.yml" | sed -n "s/^ *$2: \"\(.*\)\"\$/\1/p" | sort -u; }
          versions="$(setting "$TAG" MARKETING_VERSION)"
          if [ "$versions" != "$CORE" ]; then
            echo "::error file=apple/project.yml::MARKETING_VERSION is \"$(echo "$versions" | tr '\n' ' ')\", the tag says \"$CORE\""
            exit 1
          fi
          if previous="$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2> /dev/null)" \
            && [ "$(setting "$TAG" CURRENT_PROJECT_VERSION)" -le "$(setting "$previous" CURRENT_PROJECT_VERSION)" ]; then
            echo "::warning file=apple/project.yml::CURRENT_PROJECT_VERSION is not above the one of $previous: TestFlight and the App Store refuse a build number they have seen"
          fi

      - name: Chọn Xcode ổn định mới nhất
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: SQLCipher and the Xcode project
        working-directory: apple
        run: |
          ThirdParty/SQLCipher/fetch.sh
          # The script of the workflow's own commit: an older tag (v0.1.0-beta.1) predates it.
          xcodegen="$(git show "$GITHUB_SHA:Tools/fetch-xcodegen.sh" | sh -s -- "$RUNNER_TEMP/xcodegen")"
          xcodebuild -version
          "$xcodegen" --version
          "$xcodegen" generate

      - name: Build iOS app for devices (Release, unsigned) and package the IPA
        if: matrix.platform == 'ios'
        working-directory: apple
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          xcodebuild build \
            -project HandLive.xcodeproj \
            -scheme HandLiveiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
          work="$RUNNER_TEMP/ipa"
          mkdir -p "$work/Payload" "$RUNNER_TEMP/out"
          cp -R "$DERIVED_DATA/Build/Products/Release-iphoneos/HandLive.app" "$work/Payload/"
          (cd "$work" && zip -qry "$RUNNER_TEMP/out/HandLive-$VERSION-ios-unsigned.ipa" Payload)

      # Which macOS path: all seven secrets set means Developer ID, none means ad hoc, anything else stops here.
      - name: macOS signing secrets
        id: secrets
        if: matrix.platform == 'macos'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_MAC_PROFILE_BASE64 }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set=0
          for value in "$TEAM_ID" "$P12" "$P12_PASSWORD" "$PROFILE" "$NOTARY_KEY" "$NOTARY_KEY_ID" "$NOTARY_ISSUER"; do
            [ -z "$value" ] || set=$((set + 1))
          done
          if [ "$set" = 0 ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          elif [ "$set" != 7 ]; then
            echo "::error::Only $set of the 7 macOS signing secrets are set: set all of them or none (docs/deployment-guide.md, Release builds)"
            exit 1
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      # Universal (arm64 + x86_64) and unsigned; the steps below sign this very build. Zipped with ditto so the
      # framework's symbolic links survive. The zip stays out of the files that are published.
      - name: Build Mac app (Release, universal, unsigned)
        if: matrix.platform == 'macos'
        working-directory: apple
        run: |
          xcodebuild build \
            -project HandLive.xcodeproj \
            -scheme HandLive \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p "$RUNNER_TEMP/in" "$RUNNER_TEMP/out"
          ditto -c -k --keepParent "$DERIVED_DATA/Build/Products/Release/HandLive.app" "$RUNNER_TEMP/in/HandLive-unsigned.app.zip"

      # Without Developer ID it ships signed ad hoc (no entitlements, no hardened runtime), which seals the bundle so
      # macOS offers Open Anyway instead of calling it damaged; the app then uses the login keychain (0.6.1). The
      # launch job runs it; this job only signs and packs it.
      - name: Ad-hoc signed Mac DMG
        if: matrix.platform == 'macos' && steps.secrets.outputs.signed == 'false'
        working-directory: apple
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # An ad-hoc signed build works only once the app falls back to the login keychain (0.6.1).
          if ! grep -q processCanUseDataProtectionKeychain Packages/HLCrypto/Sources/HLCrypto/KeychainSecretStore.swift; then
            echo "::notice title=macOS not published::$TAG predates the login-keychain fallback: its Mac app runs only signed with Developer ID (docs/deployment-guide.md, Release builds)."
            exit 0
          fi
          app="$RUNNER_TEMP/adhoc/HandLive.app"
          mkdir -p "$RUNNER_TEMP/adhoc"
          ditto -x -k "$RUNNER_TEMP/in/HandLive-unsigned.app.zip" "$RUNNER_TEMP/adhoc"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          ditto "$app" "$stage/HandLive.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "HandLive $VERSION" -srcfolder "$stage" -ov -format UDZO \
            "$RUNNER_TEMP/out/HandLive-$VERSION-macos-unsigned.dmg"

      # ---------------------------------------------------------------------------------------------------------
      # PLACEHOLDER: Developer ID signing and notarization. These steps run only with all seven secrets (the
      # secrets step above); each reads its secrets in its own env. Anything new that needs a secret goes between
      # this marker and the "Remove the release keychain" step, and nothing in between may execute the built app:
      # the launch job does that, without secrets, from the DMG these steps write to $RUNNER_TEMP/out.
      # ---------------------------------------------------------------------------------------------------------
      - name: Developer ID certificate and provisioning profile
        id: identity
        if: matrix.platform == 'macos' && steps.secrets.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_MAC_PROFILE_BASE64 }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/developer-id.p12"' EXIT
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT" # the cleanup step removes it whatever happens next
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Search the release keychain first and keep the runner's own ones.
          # shellcheck disable=SC2046 # one path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -v team="($TEAM_ID)" '/Developer ID Application/ && index($0, team) { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::No \"Developer ID Application\" identity of team $TEAM_ID in APPLE_DEVELOPER_ID_P12_BASE64"; exit 1
          fi
          profile="$RUNNER_TEMP/developer-id.provisionprofile"
          plist="$RUNNER_TEMP/profile.plist"
          printf '%s' "$PROFILE" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$plist"
          read_profile() { /usr/libexec/PlistBuddy -c "Print :$1" "$plist" 2> /dev/null; }
          # A Developer ID profile of this team and App ID, made for this certificate, granting what the app uses: a
          # wrong one still notarizes but the system kills the app at launch.
          if [ "$(read_profile TeamIdentifier:0)" != "$TEAM_ID" ] \
            || [ "$(read_profile Entitlements:com.apple.application-identifier)" != "$TEAM_ID.app.handlive.mac" ]; then
            echo "::error::APPLE_MAC_PROFILE_BASE64 is not a profile of $TEAM_ID.app.handlive.mac"; exit 1
          fi
          if [ "$(read_profile ProvisionsAllDevices)" != true ]; then
            echo "::error::APPLE_MAC_PROFILE_BASE64 is not a Developer ID profile (ProvisionsAllDevices is not true)"; exit 1
          fi
          covered=no
          index=0
          while certificate="$(plutil -extract "DeveloperCertificates.$index" raw -o - "$plist" 2> /dev/null)"; do
            if [ "$(printf '%s' "$certificate" | base64 --decode | shasum -a 1 | awk '{ print toupper($1) }')" = "$identity" ]; then
              covered=yes
            fi
            index=$((index + 1))
          done
          if [ "$covered" != yes ]; then
            echo "::error::APPLE_MAC_PROFILE_BASE64 does not include the certificate of APPLE_DEVELOPER_ID_P12_BASE64"; exit 1
          fi
          for key in com.apple.developer.usernotifications.communication \
            com.apple.developer.usernotifications.time-sensitive keychain-access-groups; do
            if ! read_profile "Entitlements:$key" > /dev/null; then
              echo "::error::APPLE_MAC_PROFILE_BASE64 does not grant $key: turn the capability on for app.handlive.mac and make the profile again"; exit 1
            fi
          done
          { echo "identity=$identity"; echo "profile=$profile"; } >> "$GITHUB_OUTPUT"

      # Inside out: embedded frameworks first (SQLCipher), then the app with its entitlements, the hardened runtime and
      # a secure timestamp. macOS/HandLive.entitlements is the source; the resource-access entitlements the hardened
      # runtime needs (com.apple.security.device.audio-input, com.apple.security.automation.apple-events, …) go there
      # once the app uses those resources.
      - name: Sign the Mac app
        id: signed
        if: matrix.platform == 'macos' && steps.secrets.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
          PROFILE: ${{ steps.identity.outputs.profile }}
        run: |
          mkdir -p "$RUNNER_TEMP/mac"
          ditto -x -k "$RUNNER_TEMP/in/HandLive-unsigned.app.zip" "$RUNNER_TEMP/mac"
          app="$RUNNER_TEMP/mac/HandLive.app"
          # Every piece of code in the bundle must be one this step signs: the main executable or a top-level
          # framework or dylib. An extension, login item or helper needs its own entitlements and signing first.
          while IFS= read -r -d '' file; do
            relative="${file#"$app"/Contents/}"
            if [ "$relative" = MacOS/HandLive ] || ! file -b "$file" | grep -q Mach-O \
              || [[ "$relative" =~ ^Frameworks/[^/]+\.framework/Versions/[^/]+/[^/]+$ ]] \
              || [[ "$relative" =~ ^Frameworks/[^/]+\.dylib$ ]]; then
              continue
            fi
            echo "::error::Contents/$relative is code this workflow does not sign yet: sign it with its own entitlements first"
            exit 1
          done < <(find "$app/Contents" -type f -print0)
          cp "$PROFILE" "$app/Contents/embedded.provisionprofile"
          entitlements="$RUNNER_TEMP/HandLive.entitlements"
          sed "s/\$(AppIdentifierPrefix)/$TEAM_ID./g" apple/macOS/HandLive.entitlements > "$entitlements"
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $TEAM_ID.app.handlive.mac" "$entitlements"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$entitlements"
          for item in "$app"/Contents/Frameworks/*.framework "$app"/Contents/Frameworks/*.dylib; do
            [ -e "$item" ] || continue
            codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" --sign "$IDENTITY" "$item"
          done
          codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" --sign "$IDENTITY" \
            --entitlements "$entitlements" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "app=$app" >> "$GITHUB_OUTPUT"

      # The signed app goes into a DMG signed with the same identity; notarizing the DMG covers the app inside, and
      # the ticket is stapled to the DMG.
      - name: Signed Mac DMG, notarized and stapled
        if: matrix.platform == 'macos' && steps.secrets.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
          IDENTITY: ${{ steps.identity.outputs.identity }}
          APP: ${{ steps.signed.outputs.app }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$key"
          dmg="$RUNNER_TEMP/out/HandLive-$VERSION-macos.dmg"
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          ditto "$APP" "$stage/HandLive.app"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "HandLive $VERSION" -srcfolder "$stage" -ov -format UDZO "$dmg"
          codesign --force --timestamp --keychain "$KEYCHAIN" --sign "$IDENTITY" "$dmg"
          # notarytool exits 0 for a rejected submission too: read its status.
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary.json"
          status="$(plutil -extract status raw -o - "$RUNNER_TEMP/notary.json")"
          if [ "$status" != Accepted ]; then
            id="$(plutil -extract id raw -o - "$RUNNER_TEMP/notary.json")"
            xcrun notarytool log "$id" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
            echo "::error::Notarization $status"; exit 1
          fi
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Remove the release keychain
        if: always() && matrix.platform == 'macos' && steps.identity.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN"

      # SHA-256 of every file this leg made; publish checks them again after the files crossed the jobs.
      - name: Checksums
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p out
          cd out
          for file in *; do
            [ -e "$file" ] || continue
            shasum -a 256 "$file" > "$file.sha256"
          done
          ls -l

      - name: Keep the files for the launch and publish jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-${{ matrix.platform }}-${{ steps.tag.outputs.version }}
          path: ${{ runner.temp }}/out/
          # A tag older than the login-keychain fallback has no Mac file without Developer ID.
          if-no-files-found: ignore
          retention-days: 7

  # Runs the built code and nothing else: no environment, no secret, no token rights, no repository checkout.
  launch:
    name: launch the built apps
    needs: sign
    # macOS 15 on purpose: this job only checks, unpacks and launches the built apps (no actool), so the Mac app also
    # gets a smoke test on a macOS older than 26 (it supports macOS 13+). Only the jobs that compile the app icon need
    # macos-26.
    runs-on: macos-15
    timeout-minutes: 15
    permissions: {}
    env:
      VERSION: ${{ needs.sign.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*-${{ needs.sign.outputs.version }}
          path: ${{ runner.temp }}/in
          merge-multiple: true

      - name: Files match their SHA-256
        working-directory: ${{ runner.temp }}/in
        run: |
          shopt -s nullglob
          sums=(*.sha256)
          if [ "${#sums[@]}" = 0 ]; then
            echo "::error::No file from the sign job"; exit 1
          fi
          for sum in "${sums[@]}"; do shasum -a 256 -c "$sum"; done

      - name: The IPA is an archive with the app inside
        run: |
          ipa="$RUNNER_TEMP/in/HandLive-$VERSION-ios-unsigned.ipa"
          if [ ! -e "$ipa" ]; then
            echo "::error::$(basename "$ipa") is missing"; exit 1
          fi
          unzip -tq "$ipa"
          unzip -l "$ipa" | grep -q 'Payload/HandLive.app/Info.plist'

      # The system kills an app whose entitlements its profile does not grant: it must still run after 10 s. The DMG
      # is the ad-hoc signed one or, with Developer ID, the notarized one.
      - name: The Mac app launches
        run: |
          shopt -s nullglob
          dmgs=("$RUNNER_TEMP"/in/HandLive-"$VERSION"-macos*.dmg)
          if [ "${#dmgs[@]}" = 0 ]; then
            echo "::notice title=macOS not launched::no Mac DMG for $TAG"; exit 0
          fi
          if [ "${#dmgs[@]}" != 1 ]; then
            echo "::error::Expected one Mac DMG, found ${#dmgs[@]}"; exit 1
          fi
          mount="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mount" "$RUNNER_TEMP/launch"
          hdiutil attach "${dmgs[0]}" -readonly -nobrowse -mountpoint "$mount"
          ditto "$mount/HandLive.app" "$RUNNER_TEMP/launch/HandLive.app"
          hdiutil detach "$mount"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/launch/HandLive.app"
          "$RUNNER_TEMP/launch/HandLive.app/Contents/MacOS/HandLive" > "$RUNNER_TEMP/launch.log" 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2> /dev/null; then
            cat "$RUNNER_TEMP/launch.log"; echo "::error::The Mac app quit at launch"; exit 1
          fi
          kill "$pid"

  # Writes the Release; runs no built code and checks nothing out.
  publish:
    name: publish
    needs: [sign, launch]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # create the Release and upload its assets
    env:
      VERSION: ${{ needs.sign.outputs.version }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
      REPLACE: ${{ inputs.replace || false }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-*-${{ needs.sign.outputs.version }}
          path: ${{ runner.temp }}/out
          merge-multiple: true

      # The files crossed two jobs: each must still match the SHA-256 the sign job wrote, and every file needs one.
      - name: Checksums
        working-directory: ${{ runner.temp }}/out
        run: |
          shopt -s nullglob
          if [ ! -e "HandLive-$VERSION-ios-unsigned.ipa" ]; then
            echo "::error::HandLive-$VERSION-ios-unsigned.ipa is missing"; exit 1
          fi
          for file in *; do
            [[ "$file" == *.sha256 ]] && continue
            [ -e "$file.sha256" ] || { echo "::error::$file has no SHA-256 file"; exit 1; }
          done
          for sum in *.sha256; do
            [ -e "${sum%.sha256}" ] || { echo "::error::$sum without its file"; exit 1; }
            sha256sum --check --strict "$sum"
          done
          ls -l

      - name: Keep the files as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-${{ needs.sign.outputs.version }}
          path: ${{ runner.temp }}/out/
          retention-days: 14

      - name: Attach to the GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP"/out/*)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Published files and their checksums stay as users downloaded them unless replace=true.
            attached="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for file in "${files[@]}"; do
              if printf '%s\n' "$attached" | grep -qxF "$(basename "$file")" && [ "$REPLACE" != true ]; then
                echo "::error::$(basename "$file") is already attached to $TAG: run again with replace=true to replace it"
                exit 1
              fi
            done
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=()
            if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "HandLive $TAG" --generate-notes "${prerelease[@]}"
          fi
